name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Add random delay (avoid pattern detection)
        run: sleep $((RANDOM % 120))

      - name: Curl Render Health Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://adsense-url.onrender.com/health || echo "Failed"